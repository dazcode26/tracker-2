<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <!-- Grid vertical guidelines -->
  <line x1="10" y1="4" x2="10" y2="28" stroke="#27272a" stroke-width="1"/>
  <line x1="17" y1="4" x2="17" y2="28" stroke="#27272a" stroke-width="1"/>
  <line x1="24" y1="4" x2="24" y2="28" stroke="#27272a" stroke-width="1"/>
  <!-- Gantt Chart bars -->
  <!-- Bar 1 (Orange) -->
  <rect x="5" y="7" width="11" height="4.5" rx="2.25" fill="#f97316"/>
  <!-- Bar 2 (Blue) -->
  <rect x="12" y="13.75" width="14" height="4.5" rx="2.25" fill="#3b82f6"/>
  <!-- Bar 3 (Emerald) -->
  <rect x="8" y="20.5" width="18" height="4.5" rx="2.25" fill="#10b981"/>
</svg>
